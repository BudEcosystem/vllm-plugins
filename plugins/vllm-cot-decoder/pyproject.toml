[project]
name = "vllm-cot-decoder"
version = "0.1.0"
description = "Confidence-weighted Chain-of-Thought decoding for vLLM"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

# Entry point for vLLM logits processor plugin discovery
[project.entry-points."vllm.logits_processors"]
cot_decoder = "vllm_cot_decoder.processor:CoTLogitsProcessor"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_cot_decoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
