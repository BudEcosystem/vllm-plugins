[project]
name = "vllm-custom-loggers"
version = "0.1.0"
description = "Custom stat loggers for vLLM metrics and monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "vllm>=0.8.0",
]

[project.optional-dependencies]
prometheus = ["prometheus-client>=0.17.0"]
datadog = ["datadog>=0.44.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.entry-points."vllm.stat_logger_plugins"]
custom_loggers = "vllm_custom_loggers.register:JsonFileLogger"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_custom_loggers*"]
