[project]
name = "vllm-patches"
version = "0.1.0"
description = "Surgical patches for vLLM classes without forking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "vllm>=0.8.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.entry-points."vllm.general_plugins"]
vllm_patches = "vllm_patches.register:register"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_patches*"]
